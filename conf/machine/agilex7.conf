#@TYPE: Machine
#@NAME: agilex7
#@DESCRIPTION: Machine configuration for the Altera Agilex 7 SoC FPGA

DESCRIPTON = "BSP Machine configuration for the Intel PSG (ALTERA) Agilex 7 SoC-FPGA"

require conf/machine/include/socfpga_armv8a.inc

KBUILD_DEFCONFIG ?= "agilex7_defconfig"

SERIAL_CONSOLES ?= "115200;ttyS0"

IMAGE_FSTYPES += "tar.gz"
# Kernel provider configuration
PREFERRED_PROVIDER_virtual/kernel = "linux-altera"

# Set kernel devicetree for Agilex 7 SoCDK
KERNEL_DEVICETREE = "intel/socfpga_agilex7m_socdk.dtb"
