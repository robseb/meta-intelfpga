#@TYPE: Machine
#@NAME: agilex5
#@DESCRIPTION: Machine configuration for the Intel Agilex 5 SoC FPGA

DESCRIPTION = "BSP Machine configuration for the Intel PSG (ALTERA) Agilex 5 SoC FPGA with ARM DynamIQ"

require conf/machine/include/socfpga_armv8a.inc
require conf/machine/include/arm/armv8a/tune-cortexa72.inc
require conf/machine/include/arm/armv8-2a/tune-cortexa76-cortexa55.inc

# ARM DynamIQ optimization: 2x Cortex-A55 (efficient) + 2x Cortex-A76 (performance)
# Use ARM DynamIQ big.LITTLE tuning for heterogeneous cores with DynamIQ enabled
DEFAULTTUNE = "cortexa76-cortexa55"

# DynamIQ enabled by default for Agilex5 hardware
AGILEX5_DYNAMIQ_ENABLE = "1"

# Kernel provider - prefer linux-altera for Agilex 5 hardware
PREFERRED_PROVIDER_virtual/kernel = "linux-altera"

# Set kernel devicetree for ARM DynamIQ architecture
KERNEL_DEVICETREE = "intel/socfpga_agilex5_socdk.dtb"

SERIAL_CONSOLES ?= "115200;ttyS0"

IMAGE_FSTYPES += "tar.gz ext4"

# WKS file for physical hardware
WKS_FILE:agilex5 = "agilex5.wks"

# ARM DynamIQ scheduler configuration
MACHINE_EXTRA_RRECOMMENDS += "rsyocto-dynamiq-scheduler"
MACHINE_EXTRA_RRECOMMENDS += "rsyocto-cpu-optimizer"

# Additional packages for ARM DynamIQ support
MACHINE_EXTRA_RRECOMMENDS += "cpufrequtils numactl util-linux-taskset"

KBUILD_DEFCONFIG ?= "agilex5_defconfig"
