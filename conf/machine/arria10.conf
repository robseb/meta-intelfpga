#@TYPE: Machine
#@NAME: arria10
#@DESCRIPTION: Machine configuration for the Altera Arria 10 SoC FPGA

DESCRIPTON = "BSP Machine configuration for the Intel PSG (ALTERA) Arria 10 SX SoC-FPGA"

require conf/machine/include/socfpga.inc

# Kernel provider - prefer linux-altera for Arria 10 hardware
PREFERRED_PROVIDER_virtual/kernel = "linux-altera"

KMACHINE = "arria10"

SERIAL_CONSOLES ?= "115200;ttyS0"

IMAGE_FSTYPES += "tar.gz"
KBUILD_DEFCONFIG ?= "socfpga_defconfig"
