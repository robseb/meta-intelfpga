#@TYPE: Machine
#@NAME: cyclone5
#@DESCRIPTION: Machine configuration for the Altera Cyclone V SoC FPGA

DESCRIPTON = "BSP Machine configuration for the Intel PSG (ALTERA) Cyclone V SoC FPGA"

require conf/machine/include/socfpga.inc

KMACHINE = "cyclone5"
KBUILD_DEFCONFIG ?= "socfpga_defconfig"

# Serial Console Setting 
SERIAL_CONSOLES ?= "115200;ttyS0"

IMAGE_FSTYPES += "tar.gz"


# Kernel provider configuration
PREFERRED_PROVIDER_virtual/kernel = "linux-altera"
