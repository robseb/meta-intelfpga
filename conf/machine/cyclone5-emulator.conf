#@TYPE: Machine
#@NAME: cyclone5-emulator
#@DESCRIPTION: Machine configuration for the Altera Cyclone V SoC FPGA emulator

DESCRIPTION = "BSP Machine configuration for the Intel PSG (ALTERA) Cyclone V SoC FPGA emulator"

require conf/machine/include/arm/armv7a/tune-cortexa15.inc

KMACHINE = "qemuarma15"
MACHINE_NAME = "cyclone5_emulator"

# Kernel configuration - use linux-yocto for QEMU compatibility like other emulators
# Default to linux-yocto for QEMU compatibility
CYCLONE5_KERNEL_PROVIDER ??= "linux-yocto"
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.6%"

# For hardware builds: override in local.conf with: CYCLONE5_KERNEL_PROVIDER = "linux-altera"
# PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"

# Set kernel devicetree for the machine (empty for built-in QEMU virt DTB)
KERNEL_DEVICETREE = ""

# Serial console configuration like qemuarm
SERIAL_CONSOLES ?= "115200;ttyAMA0"

# QEMU settings for ARM Cortex-A15 (2 cores, 2GB RAM)
QB_SYSTEM_NAME = "qemu-system-arm"
QB_MEM = "-m 2048"
QB_MACHINE = "-machine virt,highmem=off"
QB_CPU = "-cpu cortex-a15 -smp 2"
QB_KERNEL_CMDLINE_APPEND = "console=ttyAMA0,115200 earlycon=pl011,0x9000000 debug loglevel=8 earlyprintk ignore_loglevel"

# Configurable acceleration (KVM vs TCG)
# Default to TCG for compatibility with nested virtualization
# Users can override in local.conf with:
# CYCLONE5_QEMU_ACCEL = "kvm" or "tcg"
CYCLONE5_QEMU_ACCEL ??= "tcg"
QB_OPT_APPEND = "-nographic -accel ${CYCLONE5_QEMU_ACCEL}"
# KVM requires specific CPU settings when enabled
QB_CPU_KVM = "-cpu cortex-a15"
QB_CPU_TCG = "-cpu cortex-a15"
# Network settings - use simpler configuration
QB_TAP_OPT = "-netdev tap,id=net0,ifname=@TAP@,script=no,downscript=no"
QB_NETWORK_DEVICE = "-device virtio-net-device,netdev=net0,mac=@MAC@"
QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp::2222-:22"
QB_DTB = ""
QB_DRIVE_TYPE = "/dev/vda"
QB_ROOTFS_OPT = "-drive id=disk0,file=@ROOTFS@,if=none,format=raw -device virtio-blk-device,drive=disk0"
# Use virtio serial console like qemuarm
QB_SERIAL_OPT = "-device virtio-serial-device -chardev null,id=virtcon -device virtconsole,chardev=virtcon"

# U-Boot configuration - disabled for testing
#UBOOT_MACHINE = "socfpga_cyclone5_defconfig"
#PREFERRED_PROVIDER_virtual/bootloader = "u-boot"

# Enable QEMU-specific image formats - removed wic.qcow2 for testing
IMAGE_CLASSES += "qemuboot"
IMAGE_FSTYPES += "ext4"

# Additional hardware support
MACHINE_FEATURES += "ext2 ext3 serial"

# WIC image support - disable custom WKS for now
#WKS_FILE = "cyclone5-emulator.wks"
#IMAGE_BOOT_FILES = "zImage cyclone5-emulation.dtb"