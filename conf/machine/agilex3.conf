#@TYPE: Machine
#@NAME: agilex3
#@DESCRIPTION: Machine configuration for the Altera Agilex 3 SoC FPGA

DESCRIPTON = "BSP Machine configuration for the Intel PSG (ALTERA) Agilex 3 SoC-FPGA"

require conf/machine/include/socfpga_armv8a.inc

# Kernel provider - prefer linux-altera for Agilex 3 hardware
PREFERRED_PROVIDER_virtual/kernel = "linux-altera"

# Set kernel devicetree for Agilex 3 SoCDK
KERNEL_DEVICETREE = "intel/socfpga_agilex_socdk.dtb"

SERIAL_CONSOLES ?= "115200;ttyS0"

IMAGE_FSTYPES += "tar.gz"
KBUILD_DEFCONFIG ?= "defconfig"
