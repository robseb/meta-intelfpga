#@TYPE: Machine
#@NAME: agilex7-emulator
#@DESCRIPTION: Machine configuration for the Altera Agilex 7 SoC FPGA emulator

DESCRIPTION = "BSP Machine configuration for the Intel PSG (ALTERA) Agilex 7 SoC FPGA emulator"

require conf/machine/include/arm/armv8a/tune-cortexa57.inc

# Override DEFAULTTUNE to ensure ARM64
DEFAULTTUNE = "cortexa57"

KMACHINE = "qemuarm64"
MACHINE_NAME = "agilex7_emulator"

# Kernel configuration - allow local.conf to override
# Default to linux-yocto for QEMU compatibility
AGILEX7_KERNEL_PROVIDER ??= "linux-yocto"
PREFERRED_PROVIDER_virtual/kernel = "linux-yocto"
PREFERRED_VERSION_linux-yocto ?= "6.6%"

# Set kernel devicetree for the machine (empty for built-in QEMU virt DTB)
KERNEL_DEVICETREE = ""

# Serial console configuration for ARM64 QEMU virt
SERIAL_CONSOLES ?= "115200;ttyAMA0"

# QEMU settings for ARM64 Cortex-A57 (4 cores, 2GB RAM)
QB_SYSTEM_NAME = "qemu-system-aarch64"
QB_MEM = "-m 2048"
QB_MACHINE = "-machine virt,highmem=on"
QB_CPU = "-cpu cortex-a57 -smp 4"
QB_KERNEL_CMDLINE_APPEND = "console=ttyAMA0,115200 earlycon=pl011,0x9000000 debug loglevel=8 earlyprintk ignore_loglevel"

# Configurable acceleration (KVM vs TCG)
# Default to TCG for compatibility with nested virtualization
# Users can override in local.conf with:
# AGILEX7_QEMU_ACCEL = "kvm" or "tcg"
AGILEX7_QEMU_ACCEL ??= "tcg"
QB_OPT_APPEND = "-nographic -accel ${AGILEX7_QEMU_ACCEL}"

# Network settings - use virtio for better performance
QB_TAP_OPT = "-netdev tap,id=net0,ifname=@TAP@,script=no,downscript=no"
QB_NETWORK_DEVICE = "-device virtio-net-device,netdev=net0,mac=@MAC@"
QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp::2222-:22"
QB_DTB = ""
QB_DRIVE_TYPE = "/dev/vda"
QB_ROOTFS_OPT = "-drive id=disk0,file=@ROOTFS@,if=none,format=raw -device virtio-blk-device,drive=disk0"
# Use virtio serial console like qemuarm64
QB_SERIAL_OPT = "-device virtio-serial-device -chardev null,id=virtcon -device virtconsole,chardev=virtcon"

# Enable QEMU-specific image formats
IMAGE_CLASSES += "qemuboot"
IMAGE_FSTYPES += "ext4"

# Additional hardware support
MACHINE_FEATURES += "ext2 ext3 serial"

# ARM64 specific settings
KERNEL_IMAGETYPE = "Image"
MACHINE_EXTRA_RRECOMMENDS += "kernel-modules"