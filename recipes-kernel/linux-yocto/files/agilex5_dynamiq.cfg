# Agilex 5 DynamIQ Configuration
# ARM DynamIQ big.LITTLE support for heterogeneous cores
# CONFIG for physical Agilex 5 hardware

# ARM DynamIQ CPU topology and power management
CONFIG_ARM_PSCI=y
CONFIG_ARM_PSCI_FW=y
CONFIG_ARM_PSCI_CHECKER=y
CONFIG_CPU_THERMAL=y
CONFIG_THERMAL_WRITABLE_TRIPS=y
CONFIG_THERMAL_DEFAULT_GOV_STEP_WISE=y
CONFIG_THERMAL_GOV_STEP_WISE=y
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_DEFAULT_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_GOV_ONDEMAND=y
CONFIG_CPU_FREQ_GOV_CONSERVATIVE=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_CPUFREQ_DT=y

# ARM DynamIQ CPU Idle support  
CONFIG_CPU_IDLE=y
CONFIG_CPU_IDLE_GOV_LADDER=y
CONFIG_CPU_IDLE_GOV_MENU=y
CONFIG_ARM_CPUIDLE=y

# NUMA support for big.LITTLE topology
CONFIG_NUMA=y
CONFIG_ARM64_ACPI_NUMA=y

# ARM big.LITTLE IKS (In-Kernel Switcher)
CONFIG_BIG_LITTLE=y
CONFIG_ARM_BIG_LITTLE_CPUFREQ=y

# Power Management
CONFIG_PM=y
CONFIG_PM_SLEEP=y
CONFIG_PM_RUNTIME=y
CONFIG_PM_DEBUG=y
CONFIG_PM_ADVANCED_DEBUG=y

# Heterogeneous Multi-Processing (HMP) scheduler
CONFIG_SCHED_HMP=y
CONFIG_HMP_FREQUENCY_INVARIANT_SCALE=y
CONFIG_HMP_VARIABLE_SCALE=y
CONFIG_SCHED_HMP_PRIO_FILTER=y
CONFIG_SCHED_FREQ_INPUT=y

# ARM Performance Monitor Unit (PMU)
CONFIG_ARM_PMU=y
CONFIG_ARM_PMU_ACPI=y

# ARM64 crypto acceleration
CONFIG_ARM64_CRYPTO=y
CONFIG_CRYPTO_SHA1_ARM64_CE=y
CONFIG_CRYPTO_SHA2_ARM64_CE=y
CONFIG_CRYPTO_GHASH_ARM64_CE=y
CONFIG_CRYPTO_AES_ARM64_CE_CCM=y
CONFIG_CRYPTO_AES_ARM64_CE_BLK=y

# Memory management for Agilex 5
CONFIG_ARM64_4K_PAGES=y
CONFIG_ARM64_VA_BITS_39=y
CONFIG_ARM64_PA_BITS_40=y
CONFIG_ZONE_DMA32=y

# Interrupt controller
CONFIG_ARM_GIC=y
CONFIG_ARM_GIC_V3=y
CONFIG_ARM_GIC_V3_ITS=y

# Timer support
CONFIG_ARM_ARCH_TIMER=y
CONFIG_ARM_ARCH_TIMER_EVTSTREAM=y

# Serial console
CONFIG_SERIAL_8250=y
CONFIG_SERIAL_8250_CONSOLE=y
CONFIG_SERIAL_8250_DW=y
CONFIG_SERIAL_OF_PLATFORM=y

# RTC support
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_SNVS=y

# GPIO support
CONFIG_GPIOLIB=y
CONFIG_GPIO_DWAPB=y

# I2C support  
CONFIG_I2C=y
CONFIG_I2C_DESIGNWARE_CORE=y
CONFIG_I2C_DESIGNWARE_PLATFORM=y

# SPI support
CONFIG_SPI=y
CONFIG_SPI_DW=y
CONFIG_SPI_DW_MMIO=y

# MMC/SD support
CONFIG_MMC=y
CONFIG_MMC_DW=y

# USB support
CONFIG_USB_SUPPORT=y
CONFIG_USB=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_PLATFORM=y
CONFIG_USB_DWC3=y

# Ethernet support
CONFIG_NET_VENDOR_STMICRO=y
CONFIG_STMMAC_ETH=y
CONFIG_DWMAC_GENERIC=y

# DMA support
CONFIG_DMADEVICES=y
CONFIG_DW_DMAC=y
CONFIG_DW_DMAC_CORE=y

# Watchdog support
CONFIG_WATCHDOG=y
CONFIG_DW_WATCHDOG=y

# Hardware monitoring
CONFIG_HWMON=y
CONFIG_SENSORS_TMP102=y

# Regulators
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED_VOLTAGE=y

# Clock framework
CONFIG_COMMON_CLK=y
CONFIG_COMMON_CLK_FIXED_RATE=y

# Reset controller
CONFIG_RESET_CONTROLLER=y

# Pinctrl support
CONFIG_PINCTRL=y

# FPGA support
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ALTERA_CVP=y
CONFIG_FPGA_MGR_ALTERA_PR_IP=y
CONFIG_FPGA_BRIDGE=y
CONFIG_ALTERA_FREEZE_BRIDGE=y
CONFIG_FPGA_REGION=y
CONFIG_OF_FPGA_REGION=y

# Security features
CONFIG_ARM64_POINTER_AUTHENTICATION=y
CONFIG_UNMAP_KERNEL_AT_EL0=y
CONFIG_HARDEN_BRANCH_PREDICTOR=y
CONFIG_ARM64_SSBD=y

# Debug support
CONFIG_DEBUG_INFO=y
CONFIG_DEBUG_KERNEL=y
CONFIG_MAGIC_SYSRQ=y
CONFIG_DEBUG_FS=y
CONFIG_FTRACE=y