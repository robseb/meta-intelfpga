# Agilex 3 emulator specific kernel configuration
# Machine-specific settings for QEMU virt ARM64

# Basic ARM64 architecture support
CONFIG_ARM64=y
CONFIG_64BIT=y

# QEMU virt machine support
CONFIG_ARCH_VIRT=y
CONFIG_ARM_AMBA=y

# Power management
CONFIG_ARM_PSCI=y
CONFIG_CPU_IDLE=y
CONFIG_ARM_CPUIDLE=y

# Timers
CONFIG_ARM_ARCH_TIMER=y
CONFIG_ARM_ARCH_TIMER_EVTSTREAM=y

# Memory management
CONFIG_ARM64_4K_PAGES=y
CONFIG_ARM64_VA_BITS_39=y
CONFIG_ARM64_VA_BITS=39

# SMP support
CONFIG_SMP=y
CONFIG_NR_CPUS=8

# Preemption
CONFIG_PREEMPT=y
CONFIG_PREEMPT_COUNT=y

# Scheduler
CONFIG_HZ=250
CONFIG_HZ_250=y

# Debugging features
CONFIG_DEBUG_KERNEL=y
CONFIG_DEBUG_INFO=y
CONFIG_PRINTK=y
CONFIG_PRINTK_TIME=y