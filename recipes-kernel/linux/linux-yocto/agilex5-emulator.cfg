# Agilex5 emulator specific kernel configuration
CONFIG_ARCH_VEXPRESS=y
CONFIG_ARCH_MULTIPLATFORM=y

# Enable ARM64 features
CONFIG_ARM64=y
CONFIG_64BIT=y
CONFIG_ARM64_4K_PAGES=y
CONFIG_ARM64_VA_BITS_39=y
CONFIG_ARM64_PA_BITS_48=y

# CPU support
CONFIG_SMP=y
CONFIG_NR_CPUS=8
CONFIG_HOTPLUG_CPU=y

# Memory management  
CONFIG_ARM64_DMA_USE_COHERENT_HELPERS=y
CONFIG_ZONE_DMA=y
CONFIG_ZONE_DMA32=y

# Platform features
CONFIG_ARM_AMBA=y
CONFIG_ARM_GIC=y
CONFIG_ARM_GIC_V3=y
CONFIG_ARM_PSCI=y

# Timer support
CONFIG_ARM_ARCH_TIMER=y
CONFIG_ARM_ARCH_TIMER_EVTSTREAM=y

# Power management
CONFIG_ARM_CPUIDLE=y
CONFIG_CPU_IDLE=y
CONFIG_CPU_FREQ=y
CONFIG_CPUFREQ_DT=y