# Disable obsolete Altera VIP framebuffer drivers
# These drivers are legacy and cause compilation errors in modern kernels
# Use modern DRM drivers instead

# Disable the old Altera VIP framebuffer driver
# CONFIG_FB_ALTERA_VIP is not set
# CONFIG_FB_ALTERA_VIP2 is not set

# Disable the specific platform driver that causes the error
# CONFIG_FB_ALTERA_VIP_FB2_PLAT is not set

# Disable framebuffer if not needed (can be re-enabled if needed)
# CONFIG_FB_ALTERA is not set

# Alternative: If framebuffer support is needed, use modern DRM
CONFIG_DRM=y
CONFIG_DRM_BRIDGE=y