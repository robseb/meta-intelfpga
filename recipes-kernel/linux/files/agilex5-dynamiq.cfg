# Agilex5 DynamIQ kernel configuration
# ARM DynamIQ support with big.LITTLE scheduling

# Enable ARM64 DynamIQ features
CONFIG_ARM64=y
CONFIG_64BIT=y
CONFIG_ARM64_4K_PAGES=y
CONFIG_ARM64_VA_BITS_48=y
CONFIG_ARM64_PA_BITS_48=y

# SMP and CPU topology for DynamIQ
CONFIG_SMP=y
CONFIG_NR_CPUS=8
CONFIG_HOTPLUG_CPU=y
CONFIG_ARM64_DMA_USE_COHERENT_HELPERS=y

# DynamIQ-specific CPU features
CONFIG_ARM64_LSE_ATOMICS=y
CONFIG_ARM64_PAN=y
CONFIG_ARM64_UAO=y
CONFIG_ARM64_VHE=y

# big.LITTLE scheduler support for DynamIQ
CONFIG_SCHED_MC=y
CONFIG_SCHED_SMT=y
CONFIG_SCHED_BOOK=y
CONFIG_SCHED_NUMA=y

# CPU frequency scaling for heterogeneous cores
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_STAT=y
CONFIG_CPU_FREQ_GOVERNOR_PERFORMANCE=y
CONFIG_CPU_FREQ_GOVERNOR_POWERSAVE=y
CONFIG_CPU_FREQ_GOVERNOR_USERSPACE=y
CONFIG_CPU_FREQ_GOVERNOR_ONDEMAND=y
CONFIG_CPU_FREQ_GOVERNOR_CONSERVATIVE=y
CONFIG_CPU_FREQ_GOVERNOR_SCHEDUTIL=y
CONFIG_CPUFREQ_DT=y
CONFIG_ARM_SCPI_CPUFREQ=y

# CPU idle for power management
CONFIG_CPU_IDLE=y
CONFIG_ARM_CPUIDLE=y
CONFIG_ARM_PSCI=y

# Memory and cache management
CONFIG_ZONE_DMA=y
CONFIG_ZONE_DMA32=y
CONFIG_ARM_AMBA=y

# Interrupt handling
CONFIG_ARM_GIC=y
CONFIG_ARM_GIC_V3=y
CONFIG_ARM_GIC_V3_ITS=y

# Timer support
CONFIG_ARM_ARCH_TIMER=y
CONFIG_ARM_ARCH_TIMER_EVTSTREAM=y

# Power management and thermal
CONFIG_PM=y
CONFIG_PM_SLEEP=y
CONFIG_PM_RUNTIME=y
CONFIG_THERMAL=y
CONFIG_CPU_THERMAL=y
CONFIG_THERMAL_GOV_BANG_BANG=y
CONFIG_THERMAL_GOV_STEP_WISE=y
CONFIG_THERMAL_GOV_FAIR_SHARE=y
CONFIG_THERMAL_GOV_USER_SPACE=y

# NUMA support for multi-cluster systems
CONFIG_NUMA=y
CONFIG_NODES_SHIFT=4

# Performance monitoring
CONFIG_ARM_PMU=y
CONFIG_ARM_SPE_PMU=y

# Memory management optimizations
CONFIG_TRANSPARENT_HUGEPAGE=y
CONFIG_COMPACTION=y
CONFIG_MIGRATION=y

# Network and I/O optimizations
CONFIG_NET_RX_BUSY_POLL=y
CONFIG_NET_BUSY_POLL=y