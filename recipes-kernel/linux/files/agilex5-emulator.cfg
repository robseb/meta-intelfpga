# Agilex5 emulator kernel configuration - DynamIQ disabled for QEMU compatibility
CONFIG_ARCH_VEXPRESS=y
CONFIG_ARCH_MULTIPLATFORM=y

# Enable ARM64 features (standard, no DynamIQ)
CONFIG_ARM64=y
CONFIG_64BIT=y
CONFIG_ARM64_4K_PAGES=y
CONFIG_ARM64_VA_BITS_39=y
CONFIG_ARM64_PA_BITS_48=y

# CPU support - 4x Cortex-A72 homogeneous cores
CONFIG_SMP=y
CONFIG_NR_CPUS=8
CONFIG_HOTPLUG_CPU=y

# Standard CPU features (no DynamIQ-specific features)
CONFIG_ARM64_LSE_ATOMICS=y
CONFIG_ARM64_PAN=y

# Simple CPU frequency scaling (no big.LITTLE)
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_GOVERNOR_PERFORMANCE=y
CONFIG_CPU_FREQ_GOVERNOR_ONDEMAND=y
CONFIG_CPUFREQ_DT=y

# Memory management  
CONFIG_ARM64_DMA_USE_COHERENT_HELPERS=y
CONFIG_ZONE_DMA=y
CONFIG_ZONE_DMA32=y

# Platform features
CONFIG_ARM_AMBA=y
CONFIG_ARM_GIC=y
CONFIG_ARM_GIC_V3=y
CONFIG_ARM_PSCI=y

# Timer support
CONFIG_ARM_ARCH_TIMER=y
CONFIG_ARM_ARCH_TIMER_EVTSTREAM=y

# Power management (basic)
CONFIG_ARM_CPUIDLE=y
CONFIG_CPU_IDLE=y