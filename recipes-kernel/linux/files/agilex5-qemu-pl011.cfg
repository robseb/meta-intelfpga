# PL011 UART and virtio support for QEMU virt machine (ARM64)
CONFIG_SERIAL_AMBA_PL011=y
CONFIG_SERIAL_AMBA_PL011_CONSOLE=y

# Ensure AMBA bus support
CONFIG_ARM_AMBA=y

# Virtio support for QEMU
CONFIG_VIRTIO=y
CONFIG_VIRTIO_PCI=y
CONFIG_VIRTIO_PCI_LEGACY=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_CONSOLE=y
CONFIG_HW_RANDOM_VIRTIO=y
CONFIG_VIRTIO_BALLOON=y

# RTC for QEMU virt  
CONFIG_RTC_DRV_PL031=y

# PCI support for virtio-pci
CONFIG_PCI=y
CONFIG_PCI_HOST_GENERIC=y

# GIC interrupt controller for QEMU virt
CONFIG_ARM_GIC=y
CONFIG_ARM_GIC_V3=y

# PSCI for QEMU virt
CONFIG_ARM_PSCI=y

# Generic timer
CONFIG_ARM_ARCH_TIMER=y