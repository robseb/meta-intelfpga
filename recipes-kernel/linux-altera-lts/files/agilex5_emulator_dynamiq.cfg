# ARM DynamIQ Configuration for Agilex 5 Emulator (QEMU)
# Author: RSyocto GmbH & Co. KG

# Base DynamIQ configuration
CONFIG_ARM64_HETEROGENEOUS_CPUS=y
CONFIG_ARM64_CPU_TOPOLOGY=y
CONFIG_GENERIC_ARCH_TOPOLOGY=y
CONFIG_SCHED_MC=y
CONFIG_SCHED_SMT=y
CONFIG_SCHED_NUMA=y

# CPU frequency scaling for QEMU
CONFIG_CPU_FREQ=y
CONFIG_CPU_FREQ_STAT=y
CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
CONFIG_CPU_FREQ_GOV_PERFORMANCE=y
CONFIG_CPU_FREQ_GOV_POWERSAVE=y
CONFIG_CPU_FREQ_GOV_SCHEDUTIL=y

# Generic CPU frequency driver for QEMU
CONFIG_CPUFREQ_DT=y
CONFIG_CPUFREQ_DT_PLATDEV=y

# CPU idle
CONFIG_CPU_IDLE=y
CONFIG_CPU_IDLE_GOV_MENU=y
CONFIG_CPU_IDLE_GOV_TEO=y
CONFIG_ARM_CPUIDLE=y
CONFIG_ARM_PSCI_CPUIDLE=y

# NUMA support
CONFIG_NUMA=y
CONFIG_NUMA_BALANCING=y
CONFIG_NUMA_BALANCING_DEFAULT_ENABLED=y

# Energy Aware Scheduling
CONFIG_ENERGY_MODEL=y

# Performance monitoring for QEMU
CONFIG_ARM64_PMU=y
CONFIG_HW_PERF_EVENTS=y
CONFIG_PERF_EVENTS=y

# QEMU VirtIO support
CONFIG_VIRTIO=y
CONFIG_VIRTIO_MMIO=y
CONFIG_VIRTIO_NET=y
CONFIG_VIRTIO_BLK=y
CONFIG_VIRTIO_CONSOLE=y
CONFIG_HW_RANDOM_VIRTIO=y

# ARM GIC for QEMU
CONFIG_ARM_GIC=y
CONFIG_ARM_GIC_V2M=y
CONFIG_ARM_GIC_V3=y

# PSCI
CONFIG_ARM_PSCI=y
CONFIG_ARM_PSCI_FW=y

# Scheduler features
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_SCHED_AUTOGROUP=y

# Power management
CONFIG_PM_RUNTIME=y
CONFIG_PM_GENERIC_DOMAINS=y

# Jailhouse hypervisor support
CONFIG_JAILHOUSE=y
CONFIG_PCI_MMCONFIG=y
CONFIG_X86_REROUTE_FOR_BROKEN_BOOT_IRQS=y